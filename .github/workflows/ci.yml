name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Backend chưa có test, nên chỉ kiểm tra cú pháp để bắt lỗi gõ sai
      - run: node --check ecommerce-backend/server.js
      - run: node --check ecommerce-backend/container.js

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [user, admin]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          CI: false
      # Test đăng nhập: chỉ app user có test. File nằm ở tests/ nên copy vào src/ (CRA chỉ quét src/)
      - name: Test đăng nhập (app user)
        if: matrix.app == 'user'
        run: |
          cp ../../tests/login-user-test.js src/login-user.test.js
          npm test -- --watchAll=false login-user