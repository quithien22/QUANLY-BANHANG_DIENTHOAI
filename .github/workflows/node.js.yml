name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Có commit mới trên cùng nhánh/PR thì huỷ lượt chạy cũ cho đỡ tốn thời gian
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Backend: Node.js + Express + SQL Server
  # package.json của backend nằm ở backend/ (không phải backend/ecommerce-backend/)
  # Không có SQL Server trên runner nên chỉ kiểm tra cú pháp + nạp thử module.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Kiểm tra cú pháp toàn bộ file .js
        run: |
          find ecommerce-backend -name '*.js' \
            -not -path '*/node_modules/*' -not -path '*/uploads/*' \
            -print0 | xargs -0 -n1 node --check
      - name: Nạp thử container.js (bắt lỗi require sai đường dẫn / thiếu module)
        working-directory: backend/ecommerce-backend
        run: node -e "require('./container'); console.log('container.js nạp OK')"

  # ---------------------------------------------------------------------------
  # Frontend: frontend/user (khách hàng) và frontend/admin (quản trị)
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [user, admin]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - run: npm ci

      # Chỉ user có test thật (tests/login-user-test.js). App.test.js ở cả hai app
      # là file mẫu của Create React App ("learn react") nên bị bỏ qua.
      # CRA chỉ quét src/ và chỉ nhận *.test.js, nên copy file vào src/ trên runner.
      - name: Test đăng nhập (user)
        if: matrix.app == 'user'
        run: |
          cp ../../tests/login-user-test.js src/login-user.test.js
          npx react-scripts test --watchAll=false login-user

      # GitHub Actions đặt CI=true, khi đó CRA coi warning ESLint là lỗi build.
      # CI=false để chỉ lỗi thật mới làm hỏng build.
      - name: Build
        run: npm run build
        env:
          CI: false

      - name: Lưu bản build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ matrix.app }}-build
          path: frontend/${{ matrix.app }}/build
          retention-days: 7

  # ---------------------------------------------------------------------------
  # AI service: FastAPI (Python)
  # ---------------------------------------------------------------------------
  ai-service:
    name: AI service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt
      - name: Kiểm tra cú pháp Python
        run: python -m compileall -q .
